name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: 
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/web-fonts/cdn.git
          git fetch upstream

      - name: Merge changes from upstream
        run: |
          git checkout main
          git merge upstream/main -m "chore: sync with upstream web-fonts/cdn"
          git push origin main
